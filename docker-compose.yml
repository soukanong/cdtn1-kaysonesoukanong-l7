# Chỉ dựng PostgreSQL 16 cho dev. Pipeline và dashboard chạy bằng Python trên máy.
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
